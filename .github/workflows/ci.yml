name: CI

# Change-management gate (SOC2 CC8.1): every push and pull request must pass a
# type check and a production build before it can be merged/deployed. Pair this
# with a branch-protection rule on the default branch requiring this check +
# at least one approving review, so changes are reviewed and verified prior to
# release.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Software Composition Analysis (ISO 27001 A.8.8 Management of Technical
      # Vulnerabilities + A.8.25-A.8.29 Secure Development). Fails the run on a
      # HIGH/CRITICAL advisory in the dependency tree so a known-vulnerable
      # package cannot be merged. Paired with Dependabot (.github/dependabot.yml)
      # for continuous CVE surfacing + automated upgrade PRs.
      - name: Dependency vulnerability scan (SCA)
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build
        env:
          # Build must succeed without real secrets; runtime config is injected
          # by the host. These placeholders only satisfy build-time presence.
          NEXT_TELEMETRY_DISABLED: "1"
